<!DOCTYPE html>
<html>
    <head>
        <title>Hello</title>
    </head>
    <body>
        Hello1
        <button onclick="getResponse()"> </button>
        <p id="hello2"></p>
        <script>
            async function getResponse() {
                const response = await fetch("https://api-test-theta-ten.vercel.app/api/test", {
                    method: "POST", 
                    body: JSON.stringify({message: "Hello from POST request"})
                });
                
                let innerJson = await response.json();
                console.log(innerJson.message);
                document.getElementById("hello2").innerText = innerJson.message;
            }
        </script>
    </body>
</html>
